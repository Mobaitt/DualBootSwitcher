[package]
name = "dualboot-switcher"
version = "0.1.3"
description = "Safe UEFI BootNext switcher"
authors = ["BootPilot contributors"]
edition = "2021"

[lib]
name = "dualboot_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
encoding_rs = "0.8"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
